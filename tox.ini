[tox]
skipsdist = True
envlist = py310, py311, py312, py313, p314

[testenv]
deps =
    aiohttp
    http_basic_auth
commands =
    pytest --cov=aiohttp_basicauth_middleware --cov-report=html
    coverage html --fail-under=100
setenv =
    LANG = ru_RU.UTF-8
    PYTHONPATH = {toxinidir}
recreate = False
allowlist_externals =
    pytest

[pep8]
max-line-length = 120
exclude = .tox

[flake8]
max-line-length = 120
exclude = .tox
